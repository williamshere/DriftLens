[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftlens"
version = "0.1.0"
description = "DriftLens — semantic drift detection across document corpora"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DriftLens Contributors" }]
keywords = ["nlp", "semantic-drift", "embeddings", "diachronic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sentence-transformers",
    "numpy",
    "scipy",
    "networkx",
    "fastapi",
    "uvicorn[standard]",
    "click>=8",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
driftlens = "driftlens.cli:app"

[project.urls]
Homepage = "https://github.com/driftlens/driftlens"
Repository = "https://github.com/driftlens/driftlens"

[tool.hatch.build.targets.wheel]
packages = ["driftlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
